<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home (SmartThings)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b1329;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        h1 { font-size: 1.5rem; margin: 0; }
        .btn {
            background-color: #2b3a5c;
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .btn:hover { background-color: #3b4e7c; }
        .btn-toggle {
            background-color: #e53935;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .btn-toggle.on {
            background-color: #43a047;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background-color: #131b36;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card h2 { font-size: 1.1rem; margin-top: 0; border-bottom: 1px solid #23315c; padding-bottom: 10px; }
        .device-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1b264f;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
        }
        .cam-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cam-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smart Home (SmartThings)</h1>
        <div>
            <button class="btn" onclick="location.reload()">🔄 Aggiorna Stato</button>
            <button class="btn" onclick="changeToken()">🔑 Cambia Token</button>
        </div>
    </header>

    <div class="grid">
        <!-- Sezione Dispositivi e Luci -->
        <div class="card">
            <h2>💡 Dispositivi e Luci</h2>
            <div id="devices-container">Caricamento dispositivi...</div>
        </div>

        <!-- Sezione Telecamera Live -->
        <div class="card">
            <h2>📷 Telecamera Live</h2>
            <div class="cam-container" id="cam-box">
                <iframe src="http://localhost:1984/embed.html?src=tapo_esterna" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('smartthings_token');

        function changeToken() {
            const newToken = prompt("Inserisci il tuo Personal Access Token di SmartThings:", token || "");
            if (newToken) {
                localStorage.setItem('smartthings_token', newToken.trim());
                location.reload();
            }
        }

        async function loadDevices() {
            const container = document.getElementById('devices-container');
            if (!token) {
                container.innerHTML = 'Token mancante. Clicca su "Cambia Token" in alto.';
                return;
            }
            
            try {
                const response = await fetch('https://api.smartthings.com/v1/devices', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                const data = await response.json();
                
                container.innerHTML = '';
                if (data.items && data.items.length > 0) {
                    
                    // 👉 È QUI CHE DEVI METTERLO:
                    const devices = data.items.filter(dev => {
                        const name = (dev.label || dev.name).toLowerCase();
                        return !name.includes('telecamera esterna');
                    });

                    // E poi il ciclo continua usando "devices" anziché "data.items":
                    for (const dev of devices) {
                        let isOn = false;
                        try {
                            const statusRes = await fetch(`https://api.smartthings.com/v1/devices/${dev.deviceId}/status`, {
                                headers: { 'Authorization': 'Bearer ' + token }
                            });
                            const statusData = await statusRes.json();
                            isOn = statusData.components?.main?.switch?.switch?.value === 'on';
                        } catch (err) {
                            console.error("Errore stato dispositivo", dev.deviceId);
                        }

                        const div = document.createElement('div');
                        div.className = 'device-item';
                        div.innerHTML = `
                            <span>💡 ${dev.label || dev.name}</span>
                            <button class="btn-toggle ${isOn ? 'on' : ''}" onclick="toggleDevice('${dev.deviceId}', ${!isOn})">
                                ${isOn ? 'ACCESO' : 'SPENTO'}
                            </button>
                        `;
                        container.appendChild(div);
                    }
                } else {
                    container.innerHTML = 'Nessun dispositivo trovato.';
                }
            } catch (e) {
                container.innerHTML = 'Errore di connessione alle API SmartThings.';
                console.error(e);
            }
        }


        async function toggleDevice(deviceId, turnOn) {
            const command = turnOn ? "on" : "off";
            try {
                await fetch(`https://api.smartthings.com/v1/devices/${deviceId}/commands`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + token,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        commands: [{
                            component: "main",
                            capability: "switch",
                            command: command
                        }]
                    })
                });
                loadDevices();
            } catch (e) {
                alert("Errore durante l'invio del comando.");
                console.error(e);
            }
        }

        loadDevices();
    </script>
</body>
</html>
